<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c1c"><title>Auto Pattern Drafter · Workspace UI Concept</title><style>
:root{--ink:#172a2b;--teal:#186472;--gold:#c7a66c;--line:#dce5e2;--muted:#708180;--panel:#fff;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #e1b763}#app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 13px;z-index:10}.brand{font-weight:850;letter-spacing:-.5px;white-space:nowrap}.brand em{font-style:normal;color:var(--teal)}.project{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow{flex:1}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:11px;min-width:39px;height:39px;padding:0 10px;color:var(--ink)}.iconbtn.active{background:var(--teal);border-color:var(--teal);color:#fff}.primary{background:var(--teal);color:#fff;border:0;border-radius:11px;padding:11px 13px;font-weight:650}.workspace{position:relative;flex:1;min-height:0;overflow:hidden}.canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background-color:#f8faf9;background-image:linear-gradient(#e8efec 1px,transparent 1px),linear-gradient(90deg,#e8efec 1px,transparent 1px);background-size:25px 25px}.canvas svg{width:100%;height:100%;display:block}.rail{position:absolute;top:15px;left:14px;display:flex;flex-direction:column;gap:7px;background:#ffffffee;border:1px solid var(--line);border-radius:17px;padding:7px;box-shadow:0 12px 30px #142a2920;z-index:4}.tool{width:43px;height:43px;border:0;border-radius:11px;background:transparent;color:var(--ink);font-size:21px}.tool.active{background:#e0f1ef;color:#145c64}.tool span{display:block;font-size:9px;margin-top:-1px}.canvasmeta{position:absolute;top:16px;left:90px;z-index:2;color:#546e6b;font-size:12px;background:#ffffffdd;border:1px solid var(--line);padding:8px 10px;border-radius:10px}.right{position:absolute;right:14px;top:15px;width:265px;max-height:calc(100% - 90px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 32px #142a2920;padding:16px;z-index:5}.right h3,.sheet h3{margin:0 0 14px;font-size:15px}.right label,.sheet label{display:block;font-size:12px;color:var(--muted);margin:13px 0 5px}.right input,.sheet input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.chip{display:inline-block;background:#e6f1ee;border-radius:7px;padding:6px 9px;margin:3px;font-size:11px}.panelhead{display:flex;align-items:center;justify-content:space-between}.close{background:transparent;border:0;font-size:21px;color:var(--muted)}.bottom{position:absolute;bottom:calc(15px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;background:#ffffffed;border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 30px #142a2926;z-index:5}.bottom button{border:0;background:transparent;border-radius:10px;padding:9px 12px;white-space:nowrap;color:var(--ink)}.bottom button.active{background:var(--teal);color:#fff}.sheet{display:none}.status{position:absolute;left:90px;bottom:18px;font-size:11px;color:var(--muted)}.hide{display:none!important}.focus .top,.focus .rail,.focus .right,.focus .canvasmeta,.focus .status{display:none!important}.focus .bottom{bottom:calc(12px + env(safe-area-inset-bottom))}.focus .canvas{background-size:25px 25px}.tip{color:#69807c;font-size:12px;line-height:1.5}.tabline{display:flex;gap:5px;flex-wrap:wrap}.tabline button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.tabline button.active{background:#e0f1ef;border-color:#8dbdb7}.mobileonly{display:none}
@media(max-width:750px){.top{height:55px;padding:0 8px;gap:5px}.brand{font-size:13px}.project{display:none}.top .optional{display:none}.top .iconbtn{min-width:34px;height:35px;padding:0 7px}.top .primary{padding:9px}.rail{top:auto;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100% - 16px);overflow:auto;border-radius:15px;gap:3px;padding:5px}.tool{flex:none;width:44px;height:45px}.canvasmeta{left:10px;top:10px;font-size:10px}.right{display:none}.sheet{display:block;position:absolute;left:0;right:0;bottom:0;max-height:min(68dvh,530px);overflow:auto;background:#fff;border-radius:23px 23px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 45px #152b2b30;z-index:9}.sheet.hide{display:none}.bottom{bottom:calc(12px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 16px);gap:2px}.bottom button{padding:10px 11px;font-size:12px}.status{display:none}.mobileonly{display:inline}.focus .rail,.focus .sheet{display:none!important}.focus .bottom{display:flex!important}}
</style><style>
:root{--teal:#145b66;--gold:#c49a56;--bg:#f5f3ed;--line:#e0e5e1}
body{background:#f5f3ed}.top{background:#142c30;color:#fff;border-bottom:2px solid #c49a56;box-shadow:0 3px 18px #10272726}.brand{font-size:14px;letter-spacing:.4px}.brand em{color:#c8b082}.top .iconbtn{background:#24474b;border-color:#426569;color:#fff}.top .iconbtn.active{background:#c49a56;color:#102d30}.top .primary{background:linear-gradient(125deg,#cda961,#ac8449);color:#152c30;font-weight:800}.canvas{background-color:#faf9f4;background-image:linear-gradient(#dfe9e4 1px,transparent 1px),linear-gradient(90deg,#dfe9e4 1px,transparent 1px);background-size:24px 24px}.canvasmeta{border-left:3px solid var(--gold);font-weight:600;box-shadow:0 4px 15px #10272712}.rail,.bottom{border:1px solid #d8e2df;box-shadow:0 8px 32px #132b2b26}.tool.active{background:#165d66;color:#fff}.bottom button.active{background:#145b66}.right{border-top:3px solid var(--gold)}.toolDrawer{position:absolute;z-index:8;left:75px;top:14px;width:300px;max-width:calc(100vw - 90px);max-height:70%;overflow:auto;background:#fff;border:1px solid #d8e2df;border-top:3px solid var(--gold);border-radius:17px;box-shadow:0 18px 48px #11292938;padding:14px}.toolDrawer h3{font-size:14px;margin:2px 0 12px}.toolDrawer h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8b7555;margin:15px 0 7px}.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.toolgrid button{padding:10px 8px;border:1px solid #dce7e3;background:#f7faf8;color:#1a3c40;border-radius:10px;text-align:left;font-size:12px}.toolgrid button.active{background:#145b66;color:#fff}.toolDrawer .close{float:right}.pieceSelected path:first-child{stroke:#c49a56!important;stroke-width:4!important}.workspace{overscroll-behavior:none}.canvas svg{touch-action:none}
@media(max-width:750px){.brand{font-size:12px}.top{border-bottom:2px solid #c49a56}.rail{bottom:calc(76px + env(safe-area-inset-bottom));max-width:calc(100% - 20px)}.bottom{bottom:calc(8px + env(safe-area-inset-bottom))}.toolDrawer{top:auto;bottom:calc(140px + env(safe-area-inset-bottom));left:12px;width:calc(100% - 24px);max-width:none;max-height:58dvh}.canvasmeta{font-size:10px}.focus .toolDrawer{display:none!important}}
</style></head><body><div id="app"><header class="top"><div class="brand">AUTO <em>PATTERN</em> DRAFTER</div><div class="project">/ Everyday Circle Skirt · UI concept</div><div class="grow"></div><button class="iconbtn optional" id="undo" title="Undo">↶</button><button class="iconbtn optional" id="redo" title="Redo">↷</button><button class="iconbtn" id="panels" title="Layers and properties">☷</button><button class="iconbtn" id="focus" title="Distraction-free canvas">⛶</button><button class="primary" id="save">Save</button></header>
<main class="workspace" id="workspace"><div class="canvas" id="canvas"><svg id="drawing" viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid meet" aria-label="Illustrative drafting workspace"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a9bcb5"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#36534b" flood-opacity=".13"/></filter></defs><g id="viewport"><g id="pieces" filter="url(#shadow)"><g id="piece1"><path d="M310 225 Q398 270 480 224 Q517 358 565 560 Q390 634 223 559 Z" fill="#fffdf7" stroke="#186472" stroke-width="2.5"/><path d="M310 225 Q398 270 480 224" fill="none" stroke="#bc8c52" stroke-width="3" stroke-dasharray="7 5"/><path d="M223 559 Q390 634 565 560" fill="none" stroke="#bc8c52" stroke-width="2" stroke-dasharray="6 6"/><path d="M396 281 V540" stroke="#94b1a7" stroke-dasharray="10 7" stroke-width="2"/><path d="M387 307 L396 281 L405 307 M387 513 L396 540 L405 513" fill="none" stroke="#94b1a7" stroke-width="2"/><text x="395" y="405" text-anchor="middle" fill="#285b60" font-size="16" font-weight="700">FRONT</text><text x="395" y="427" text-anchor="middle" fill="#68827c" font-size="12">Cut 1 on fold</text></g><g id="piece2" transform="translate(340 -25) scale(.75)"><path d="M310 225 Q398 270 480 224 Q517 358 565 560 Q390 634 223 559 Z" fill="#fffdf7" stroke="#186472" stroke-width="3"/><path d="M310 225 Q398 270 480 224" fill="none" stroke="#bc8c52" stroke-width="3" stroke-dasharray="7 5"/><path d="M223 559 Q390 634 565 560" fill="none" stroke="#bc8c52" stroke-width="2" stroke-dasharray="6 6"/><text x="395" y="405" text-anchor="middle" fill="#285b60" font-size="19" font-weight="700">BACK</text><text x="395" y="427" text-anchor="middle" fill="#68827c" font-size="15">Cut 1 on fold</text></g></g></g></svg></div><div class="canvasmeta">✦ Drafting canvas <span id="zoomlabel">100%</span> · Concept layout</div>
<nav class="rail" id="rail" aria-label="Drafting tools"><button class="tool active" data-tool="Select" title="Select">↖<span>Select</span></button><button class="tool" data-tool="Points" title="Points">✣<span>Points</span></button><button class="tool" data-tool="Lines" title="Lines">╱<span>Lines</span></button><button class="tool" data-tool="Curves" title="Curves">⌁<span>Curves</span></button><button class="tool" data-tool="Measure" title="Measure">↔<span>Measure</span></button><button class="tool" data-tool="Seams" title="Seams">〰<span>Seams</span></button><button class="tool" data-tool="Notches" title="Notches">⋀<span>Notches</span></button><button class="tool" data-tool="Text" title="Text">T<span>Text</span></button><button class="tool" id="allTools" title="All tools">▦<span>More</span></button></nav>
<aside class="right" id="inspector"><div class="panelhead"><h3>Pattern workspace</h3><button class="close" id="closepanel" aria-label="Close panel">×</button></div><div class="tabline" id="tabs"><button class="active" data-tab="Properties">Properties</button><button data-tab="Pieces">Pieces</button><button data-tab="Layers">Layers</button></div><div id="panelcontent"></div></aside>
<div class="sheet hide" id="sheet"><div class="panelhead"><h3 id="sheettitle">Properties</h3><button class="close" id="closesheet" aria-label="Close">×</button></div><div class="tabline" id="mobiletabs"><button class="active" data-tab="Properties">Properties</button><button data-tab="Pieces">Pieces</button><button data-tab="Layers">Layers</button></div><div id="sheetcontent"></div></div>
<div id="toolDrawer" class="toolDrawer hide"></div><div class="status" id="status">UI prototype only · sample pieces are illustrative</div><div class="bottom"><button id="minus" title="Zoom out">−</button><button id="zoom" title="Reset zoom">100%</button><button id="plus" title="Zoom in">＋</button><button id="fit">Fit</button><button id="mode" class="active">2D Draft</button><button id="three">3D Fit</button><button id="toolsMobile" class="mobileonly">All tools</button></div></main></div>
<script>
const $=id=>document.getElementById(id),state={tool:'Select',tab:'Properties',zoom:100,focus:false,panels:true},svg=$('drawing');function contents(){if(state.tab==='Pieces')return '<label>Pattern pieces</label><p>◉ Front skirt · Cut 1 on fold</p><p>◉ Back skirt · Cut 1 on fold</p><button class="primary" id="addpiece">＋ New piece</button><p class="tip">Choose a piece to inspect its dimensions and construction.</p>';if(state.tab==='Layers')return '<label>Visible layers</label><p><label><input type="checkbox" checked> Pattern outlines</label></p><p><label><input type="checkbox" checked> Seam allowances</label></p><p><label><input type="checkbox" checked> Grainlines & labels</label></p><p class="tip">Layer toggles are visual controls in this concept.</p>';return '<label>Active tool</label><strong>'+state.tool+'</strong><label>Selected piece</label><strong>Front skirt</strong><div class="row"><div><label>Waist (cm)</label><input type="number" value="72"></div><div><label>Length (cm)</label><input type="number" value="65"></div></div><label>Seam allowance (cm)</label><input type="number" value="1.0" step=".1"><p class="tip">Property fields are UI-only. They do not modify the production drafting engine.</p>'}
function drawPanels(){$('panelcontent').innerHTML=contents();$('sheetcontent').innerHTML=contents();$('sheettitle').textContent=state.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;drawPanels()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));state.tab='Properties';drawPanels();$('sheet').classList.add('hide')});
function panels(){if(innerWidth<=750){$('sheet').classList.toggle('hide')}else{$('inspector').classList.toggle('hide');state.panels=!$('inspector').classList.contains('hide')}}$('panels').onclick=panels;$('closepanel').onclick=()=>{$('inspector').classList.add('hide')};$('closesheet').onclick=()=>$('sheet').classList.add('hide');$('toolsMobile').onclick=()=>{$('rail').classList.toggle('hide');$('sheet').classList.add('hide')};
function zoom(z){state.zoom=Math.max(45,Math.min(220,z));svg.style.transform='scale('+(state.zoom/100)+')';svg.style.transformOrigin='center center';$('zoom').textContent=state.zoom+'%';$('zoomlabel').textContent=state.zoom+'%'}$('minus').onclick=()=>zoom(state.zoom-15);$('plus').onclick=()=>zoom(state.zoom+15);$('zoom').onclick=()=>zoom(100);$('fit').onclick=()=>zoom(100);
$('focus').onclick=()=>{state.focus=!state.focus;$('app').classList.toggle('focus',state.focus);$('focus').classList.toggle('active',state.focus);$('focus').title=state.focus?'Exit focus':'Distraction-free canvas';if(state.focus){$('sheet').classList.add('hide')}};
$('mode').onclick=()=>{alert('2D drafting workspace selected. This is a UI design preview, not the production drafting engine.')};$('three').onclick=()=>{if(confirm('Open the separate experimental 3D preview?'))location.href='./3d-preview.html'};$('save').onclick=()=>{alert('UI concept only: no pattern data was saved. Your production app is unchanged.')};$('undo').onclick=$('redo').onclick=()=>alert('Undo/redo will connect to the drafting engine in the production integration.');
const toolGroups={
'Selection & editing':['Select','Move piece','Rotate piece','Mirror','Duplicate','Delete','Align','Group'],
'Drafting':['Point','Line','Polyline','Rectangle','Circle','Arc','Bezier curve','Spline','Dart'],
'Pattern construction':['Seam allowance','Notch','Grainline','Fold line','Pleat','Slash & spread','True seam','Walk seams','Offset','Facing'],
'Measurements':['Measure length','Measure curve','Angle','Tape measure','Dimension','Body measurements'],
'Grading & production':['Grade point','Grade rule','Sizes','Nest sizes','Piece labels','Cut quantity','Export SVG','Print tiles']
};
function toolDrawer(){let h='<button class="close" id="closeDrawer" aria-label="Close tools">×</button><h3>Pattern-making toolbox</h3><p class="tip">Choose a tool category. Drawing operations will be connected to the drafting engine later.</p>';for(const [group,tools] of Object.entries(toolGroups)){h+='<h4>'+group+'</h4><div class="toolgrid">'+tools.map(t=>'<button data-extra="'+t+'" class="'+(state.tool===t?'active':'')+'">'+t+'</button>').join('')+'</div>'}$('toolDrawer').innerHTML=h;$('closeDrawer').onclick=()=>$('toolDrawer').classList.add('hide');$('toolDrawer').querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.extra;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool===state.tool));drawPanels();$('toolDrawer').classList.add('hide')})}
function toggleTools(){$('toolDrawer').classList.toggle('hide');$('sheet').classList.add('hide');toolDrawer()}$('allTools').onclick=toggleTools;$('toolsMobile').onclick=toggleTools;
const vp=$('viewport'),pieces=[$('piece1'),$('piece2')],svgEl=$('drawing');let view={scale:1,x:0,y:0},pieceOffsets=[{x:0,y:0},{x:0,y:0}],activePointers=new Map(),gesture=null,selected=0;
function renderView(){vp.setAttribute('transform','translate('+view.x+' '+view.y+') scale('+view.scale+')');pieces[0].setAttribute('transform','translate('+pieceOffsets[0].x+' '+pieceOffsets[0].y+')');pieces[1].setAttribute('transform','translate('+(340+pieceOffsets[1].x)+' '+(-25+pieceOffsets[1].y)+') scale(.75)');state.zoom=Math.round(view.scale*100);$('zoom').textContent=state.zoom+'%';$('zoomlabel').textContent=state.zoom+'%'}
function coords(e){const p=svgEl.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const matrix=svgEl.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:0,y:0}}
function local(pt){return {x:(pt.x-view.x)/view.scale,y:(pt.y-view.y)/view.scale}}
function hitPiece(target){const el=target.closest?.('#piece1,#piece2');return el?pieces.indexOf(el):-1}
function highlight(){pieces.forEach((p,i)=>p.classList.toggle('pieceSelected',i===selected))}
function zoomAround(newScale,center){const scale=Math.max(.35,Math.min(4,newScale)),before=local(center);view.scale=scale;view.x=center.x-before.x*scale;view.y=center.y-before.y*scale;renderView()}
$('minus').onclick=()=>zoomAround(view.scale/1.2,{x:500,y:375});$('plus').onclick=()=>zoomAround(view.scale*1.2,{x:500,y:375});$('zoom').onclick=$('fit').onclick=()=>{view={scale:1,x:0,y:0};renderView()};
svgEl.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const pt=coords(e);activePointers.set(e.pointerId,pt);svgEl.setPointerCapture(e.pointerId);if(activePointers.size===2){const a=[...activePointers.values()],mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};gesture={kind:'pinch',distance:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),scale:view.scale,anchor:local(mid)};return}const idx=hitPiece(e.target);if(idx>=0&&state.tool==='Select'){selected=idx;highlight();gesture={kind:'piece',idx,start:local(pt),origin:{...pieceOffsets[idx]}}}else{gesture={kind:'pan',start:pt,origin:{x:view.x,y:view.y}}}});
svgEl.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;const pt=coords(e);activePointers.set(e.pointerId,pt);if(activePointers.size>=2){const a=[...activePointers.values()],mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};if(!gesture||gesture.kind!=='pinch')return;const d=Math.max(1,Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y));view.scale=Math.max(.35,Math.min(4,gesture.scale*d/Math.max(1,gesture.distance)));view.x=mid.x-gesture.anchor.x*view.scale;view.y=mid.y-gesture.anchor.y*view.scale;renderView();return}if(!gesture)return;if(gesture.kind==='piece'){const here=local(pt);pieceOffsets[gesture.idx].x=gesture.origin.x+here.x-gesture.start.x;pieceOffsets[gesture.idx].y=gesture.origin.y+here.y-gesture.start.y;renderView()}else if(gesture.kind==='pan'){view.x=gesture.origin.x+pt.x-gesture.start.x;view.y=gesture.origin.y+pt.y-gesture.start.y;renderView()}});
function pointerEnd(e){activePointers.delete(e.pointerId);gesture=null;if(activePointers.size===1){const pt=[...activePointers.values()][0];gesture={kind:'pan',start:pt,origin:{x:view.x,y:view.y}}}}
svgEl.addEventListener('pointerup',pointerEnd);svgEl.addEventListener('pointercancel',pointerEnd);
svgEl.addEventListener('wheel',e=>{e.preventDefault();zoomAround(view.scale*(e.deltaY>0?.9:1.1),coords(e))},{passive:false});
renderView();highlight();drawPanels();
</script></body></html>
